<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <title>{% block title %}IoT Control Gateway{% endblock %}</title>
  <link rel="manifest" href="{{ static_url('manifest.json') }}">

  <!-- One family: IBM Plex Sans Thai carries its own Latin, so a second
       typeface would only be another download. If Google is unreachable the
       page falls back to the system font and carries on. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
        rel="stylesheet">

  <!-- Every script is served from here, none from a CDN: whatever runs on
       this page can switch the house's lights, so a third party must not be
       able to change it. See static/vendor/README.md to update them. -->
  <link rel="stylesheet" href="{{ static_url('tailwind.css') }}">
  <script src="{{ static_url('api.js') }}"></script>
  {% block head_scripts %}{% endblock %}
  <!-- Alpine is deferred, so it initialises after the page scripts above have
       defined the component factories they register. -->
  <script defer src="{{ static_url('vendor/alpinejs-3.14.1.min.js') }}"></script>

  <style>
    /* One palette, one place. The UI is deliberately committed to a dark
       surface -- it lives on a wall panel and a phone at night -- but every
       colour is a token, so a light theme is a block of overrides, not a
       rewrite of the markup. Surfaces are opaque: a translucent card over a
       blurred page makes a weak phone GPU composite every layer on scroll. */
    :root {
      color-scheme: dark;
      --bg:            #0b0c0f;
      --panel:         #111317;   /* dialogs */
      --surface:       #15171b;   /* cards */
      --surface-2:     #1b1d22;   /* segmented controls, toasts */
      --surface-hover: #1f2228;
      --line:          #23262c;
      --line-strong:   #2e3239;
      --text:          #ecebe6;
      --muted:         #a3a5ab;   /* sentences you read */
      --faint:         #858891;   /* labels you glance past; still 4.5:1 on cards */
      --on:            #4bbd85;   /* device is on / everything healthy */
      --on-text:       #8fdcb3;
      --warn:          #e6a94e;   /* hub reconnecting, window open, battery low */
      --warn-text:     #f0c27a;
      --danger:        #ec7a66;   /* command failed, server unreachable */
      --danger-text:   #f19a8a;
      --track:         #2b2e35;

      /* Reading colours. These are not decoration: a value carries its own
         colour, so "too hot" and "battery nearly flat" read before the number
         does. static/dashboard.js interpolates between them. */
      --c-cold:  #62a6e8;
      --c-fresh: #45c4a6;
      --c-good:  #7cc766;
      --c-warm:  #e6b44f;
      --c-hot:   #e56f5c;
      --c-lux:   #edc95c;
      --c-humid: #4fbde8;
      --c-damp:  #8b8ff0;
      --c-state: #b9a0f7;
    }

    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    [x-cloak] { display: none !important; }
    ::selection { background: rgba(255, 255, 255, .16); }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid rgba(255, 255, 255, .35); outline-offset: 2px; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .10);
      border: 3px solid var(--bg);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .18); }
    ::-webkit-scrollbar-track { background: transparent; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Sliders paint what they control: the brightness track fades up to the
       lamp's current colour, and the colour-temperature track is an actual
       Kelvin gradient -- so the control shows the outcome before you commit to
       it. `--track-img` is set per input from dashboard.js. The thumb is big
       enough to land a thumb on. */
    .slider {
      -webkit-appearance: none; appearance: none; display: block;
      height: 6px; margin: 11px 0 5px; border-radius: 999px; cursor: pointer;
      background: var(--track-img, var(--track));
    }
    .slider::-webkit-slider-runnable-track { height: 6px; background: transparent; }
    .slider::-moz-range-track { height: 6px; background: transparent; }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      margin-top: -7px; height: 20px; width: 20px; border-radius: 999px;
      background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .55);
      transition: transform .12s ease;
    }
    .slider::-moz-range-thumb {
      height: 20px; width: 20px; border: 0; border-radius: 999px; background: #fff;
    }
    .slider:active::-webkit-slider-thumb { transform: scale(1.12); }
    .slider:focus { outline: none; }
    .slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(255, 255, 255, .25); }

    /* The toggle's knob springs across rather than sliding flat. */
    .knob { transition: transform .22s cubic-bezier(.3, .9, .3, 1.2); }

    /* A command in flight: the control breathes until the device answers. */
    @keyframes pulse-soft { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    .is-pending { animation: pulse-soft 1.1s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .9s linear infinite; }

    /* Device icons. The glyph is the device type; colour and glow are its
       current state. Everything animates on transform and opacity only, which
       the compositor handles without re-laying out the card -- a phone can run
       a screenful of these without breaking a sweat, and the Pi never sees any
       of it: it ships the markup once and the browser does the rest. */
    .dev-icon {
      width: 24px; height: 24px; flex: none;
      color: var(--faint);
      transition: color .35s ease;
    }
    .dev-icon svg { width: 100%; height: 100%; display: block; }
    .dev-icon.is-active { color: var(--icon, var(--on)); }

    /* The filled twin of the outline, faded in behind it. */
    .dev-icon .glow { opacity: 0; transition: opacity .4s ease; }
    .dev-icon.is-active .glow {
      opacity: var(--glow, .2);
      animation: icon-breathe 4.8s ease-in-out infinite;
    }
    @keyframes icon-breathe {
      0%, 100% { opacity: var(--glow, .2); }
      50%      { opacity: calc(var(--glow, .2) * 2); }
    }

    /* Rays spring out when a lamp lights up. */
    .dev-icon .rays {
      opacity: 0;
      transform: scale(.55);
      transform-box: fill-box; transform-origin: center;
      transition: opacity .3s ease, transform .35s cubic-bezier(.2, .9, .3, 1.5);
    }
    .dev-icon.is-active .rays { opacity: 1; transform: scale(1); }

    /* A rocker switch actually rocks. */
    .dev-icon .lever {
      transform-box: fill-box; transform-origin: center;
      transition: transform .3s cubic-bezier(.2, .9, .3, 1.5);
    }
    .dev-icon.is-active .lever { transform: translateY(-5.4px); }

    /* A door or window swings open; hinged on the side it is drawn from. */
    .dev-icon .panel {
      transform-box: fill-box; transform-origin: left center;
      transition: transform .4s cubic-bezier(.3, .8, .3, 1);
    }
    .dev-icon.is-active .panel { transform: scaleX(.3); }

    /* Occupancy: one slow ring outward, not a strobe. */
    .dev-icon .ping {
      opacity: 0;
      transform-box: fill-box; transform-origin: center;
    }
    .dev-icon.is-active .ping { animation: icon-ping 2.6s ease-out infinite; }
    @keyframes icon-ping {
      0%        { opacity: .55; transform: scale(.55); }
      70%, 100% { opacity: 0;   transform: scale(1.1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
