<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f16">
  <title>{% block title %}IoT Control Gateway{% endblock %}</title>
  <link rel="manifest" href="{{ static_url('manifest.json') }}">
  <!-- First, before anything paints: dark or light, glass or solid. -->
  <script src="{{ static_url('theme.js') }}"></script>

  <!-- One family: IBM Plex Sans Thai carries its own Latin, so a second
       typeface would only be another download. If Google is unreachable the
       page falls back to the system font and carries on. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap"
        rel="stylesheet">

  <!-- Every script is served from here, none from a CDN: whatever runs on
       this page can switch the house's lights, so a third party must not be
       able to change it. See static/vendor/README.md to update them. -->
  <link rel="stylesheet" href="{{ static_url('tailwind.css') }}">
  <!-- Thai is the text in the code; the English table is fetched only by a
       viewer who chose English. -->
  {% if lang == 'en' %}<script src="{{ static_url('i18n/en.js') }}"></script>{% endif %}
  <script src="{{ static_url('i18n.js') }}"></script>
  <script src="{{ static_url('api.js') }}"></script>
  {% block head_scripts %}{% endblock %}
  <!-- Alpine is deferred, so it initialises after the page scripts above have
       defined the component factories they register. -->
  <script defer src="{{ static_url('vendor/alpinejs-3.14.1.min.js') }}"></script>

  <style>
    /* Nocturne: one palette in two themes (dark, light), and a glass level
       from solid to fully see-through. Every colour is a token, so the markup
       never names a theme; static/theme.js sets data-theme, data-look and
       --glass (0 = solid, 1 = full glass) on <html>.

       Panes and the glow behind them are the only things --glass moves.
       Tiles and lines are light translucent fills that read the same on a
       solid pane or a frosted one, so they need no second set of values. */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --glass:       0;
      --bg:          #0f0f16;
      --pane:        rgb(24 24 35 / calc(1 - .45 * var(--glass)));   /* sidebar, panels */
      --pane-dense:  rgb(24 24 35 / calc(1 - .15 * var(--glass)));   /* dialogs, toasts: text over busy ground */
      --tile:        rgb(255 255 255 / .055);                        /* device and group tiles */
      --tile-hover:  rgb(255 255 255 / .09);
      --line:        rgb(255 255 255 / .09);
      --line-strong: rgb(255 255 255 / .16);
      --text:        #ecebf3;
      --muted:       #b0aec2;   /* sentences you read */
      --faint:       #8e8ca2;   /* labels you glance past; 4.5:1 on a pane */
      --accent:      #8b7cf6;
      --accent-ink:  #ffffff;   /* text on an accent fill */
      --accent-text: #bbb1ff;
      --accent-soft: rgb(139 124 246 / .14);
      --accent-line: rgb(139 124 246 / .42);
      --track:       #3a3a50;
      --ok:          #56c28e;
      --ok-text:     #8fdcb3;
      --warn:        #e6a94e;
      --warn-text:   #f0c27a;
      --danger:      #ec7a66;
      --danger-text: #f19a8a;
      /* The light behind the glass fades in with it. */
      --backdrop:
        radial-gradient(55% 45% at 12% 8%, rgb(124 92 255 / calc(.42 * var(--glass))), transparent 70%),
        radial-gradient(45% 40% at 92% 18%, rgb(32 178 170 / calc(.30 * var(--glass))), transparent 70%),
        radial-gradient(60% 55% at 55% 105%, rgb(170 70 200 / calc(.24 * var(--glass))), transparent 70%),
        #0f0f16;
      --shadow:      0 10px 30px rgb(0 0 0 / .35);
      --c-state:     #b9a0f7;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg:          #efeef6;
      --pane:        rgb(255 255 255 / calc(1 - .42 * var(--glass)));
      --pane-dense:  rgb(255 255 255 / calc(1 - .15 * var(--glass)));
      --tile:        rgb(246 245 251 / calc(1 - .45 * var(--glass)));
      --tile-hover:  rgb(236 234 248 / calc(1 - .30 * var(--glass)));
      --line:        rgb(108 92 190 / .15);
      --line-strong: rgb(108 92 190 / .27);
      --text:        #1d1b29;
      --muted:       #4f4c63;
      --faint:       #67647d;
      --accent:      #6c5ce0;
      --accent-ink:  #ffffff;
      --accent-text: #5343c4;
      --accent-soft: rgb(108 92 224 / .10);
      --accent-line: rgb(108 92 224 / .35);
      --track:       #d4d1e5;
      --ok:          #2f9e6a;
      --ok-text:     #1d7a4d;
      --warn:        #c7851c;
      --warn-text:   #8f5b08;
      --danger:      #d4533e;
      --danger-text: #b23e2b;
      --backdrop:
        radial-gradient(55% 45% at 10% 5%, rgb(155 130 255 / calc(.45 * var(--glass))), transparent 70%),
        radial-gradient(45% 40% at 95% 15%, rgb(80 200 200 / calc(.30 * var(--glass))), transparent 70%),
        radial-gradient(60% 55% at 50% 105%, rgb(230 150 230 / calc(.30 * var(--glass))), transparent 70%),
        #efeef6;
      --shadow:      0 10px 30px rgb(60 50 120 / .12);
      --c-state:     #7a5fd6;
    }

    /* Any glass at all: text tokens go up a step, because translucent panes
       sit on a brighter ground than solid ones. */
    :root[data-look="glass"][data-theme="dark"] {
      --muted:       #c4c2d4;
      --faint:       #a7a5bb;
    }
    :root[data-look="glass"][data-theme="light"] {
      --muted:       #45425a;
      --faint:       #5b5872;
    }

    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1;
      background: var(--backdrop);
    }
    [x-cloak] { display: none !important; }
    ::selection { background: var(--accent-soft); }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line-strong); border: 3px solid transparent; background-clip: padding-box; border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* ── surfaces ─────────────────────────────────────────────────────── */
    .pane {
      background: var(--pane);
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    /* A dialog lies over cards and text, so it stays nearly opaque whatever
       the glass level: frosted enough to look the part, not so clear that
       what is behind competes with what is on it. */
    .pane.dense { background: var(--pane-dense); }
    /* Glass: panes frost whatever is behind them, harder the higher the
       level. Only the few large panes blur -- sidebar, panels, dialogs, the
       tab bar. The many small tiles are plain translucent fills, because a
       blur per tile is what makes an old phone stutter on scroll, and the
       light behind is one fixed layer painted once, not a background the
       page re-draws while scrolling. At level 0 data-look is "solid" and
       none of this applies, so a solid page pays nothing for it. */
    :root[data-look="glass"] .pane {
      -webkit-backdrop-filter: blur(calc(24px * var(--glass))) saturate(calc(1 + .5 * var(--glass)));
      backdrop-filter: blur(calc(24px * var(--glass))) saturate(calc(1 + .5 * var(--glass)));
      box-shadow: inset 0 1px 0 rgb(255 255 255 / calc(.07 * var(--glass))), var(--shadow);
    }
    .tile {
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: background-color .2s ease, border-color .2s ease;
    }
    a.tile:hover, .tile-link:hover { background: var(--tile-hover); }
    .tile.is-on { background: var(--accent-soft); border-color: var(--accent-line); }

    /* Segmented control: a row of buttons, the pressed one filled. */
    .seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--tile); border: 1px solid var(--line); }
    .seg > button { height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; color: var(--muted); white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
    .seg > button:hover { color: var(--text); }
    .seg > button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

    .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
    .pill-ok     { background: var(--accent-soft); color: var(--accent-text); }
    .pill-warn   { background: rgb(230 169 78 / .16); color: var(--warn-text); }
    .pill-muted  { background: var(--tile-hover); color: var(--faint); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; font-size: 15px; white-space: nowrap; transition: background-color .15s ease, opacity .15s ease; }
    .btn-accent { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
    .btn-accent:hover { opacity: .9; }
    .btn-ghost { border: 1px solid var(--line-strong); background: var(--tile); }
    .btn-ghost:hover { background: var(--tile-hover); }
    .btn:disabled { opacity: .45; }

    .field { height: 44px; width: 100%; padding: 0 12px; border-radius: 12px; font-size: 16px; color: var(--text); background: var(--tile); border: 1px solid var(--line-strong); outline: none; }
    .field:focus { border-color: var(--accent); }

    /* The toggle: a real button, its knob springing across. */
    .toggle { position: relative; flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--track); transition: background-color .2s ease; }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform .22s cubic-bezier(.3, .9, .3, 1.2); }
    .toggle[aria-pressed="true"] { background: var(--accent); }
    .toggle[aria-pressed="true"]::after { transform: translateX(18px); }
    .toggle:disabled { opacity: .45; }
    /* A bigger hit area than the drawing, for thumbs. */
    .toggle::before { content: ''; position: absolute; inset: -9px -4px; }

    /* Sliders paint what they control: brightness fades up to the accent,
       colour temperature is an actual Kelvin gradient. `--track-img` is set
       per input from dashboard.js. */
    .slider {
      -webkit-appearance: none; appearance: none; display: block; width: 100%;
      height: 6px; margin: 11px 0 5px; border-radius: 999px; cursor: pointer;
      background: var(--track-img, var(--track));
    }
    .slider::-webkit-slider-runnable-track { height: 6px; background: transparent; }
    .slider::-moz-range-track { height: 6px; background: transparent; }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      margin-top: -7px; height: 20px; width: 20px; border-radius: 999px;
      background: #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .45);
      transition: transform .12s ease;
    }
    .slider::-moz-range-thumb { height: 20px; width: 20px; border: 0; border-radius: 999px; background: #fff; }
    .slider:active::-webkit-slider-thumb { transform: scale(1.12); }
    .slider:focus { outline: none; }
    .slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }

    /* Sidebar and tab-bar links. */
    .nav-link { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 15px; color: var(--muted); transition: background-color .15s ease, color .15s ease; }
    .nav-link:hover { background: var(--tile-hover); color: var(--text); }
    .nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--text); }
    .nav-link[aria-current="page"] svg { color: var(--accent-text); }
    .tab-link { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 56px; border-radius: 14px; font-size: 11.5px; color: var(--faint); }
    .tab-link[aria-current="page"] { color: var(--accent-text); }

    /* A command in flight: the control breathes until the device answers. */
    @keyframes pulse-soft { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    .is-pending { animation: pulse-soft 1.1s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .9s linear infinite; }

    /* Device icons. The glyph is the device type; colour and glow are its
       current state. Everything animates on transform and opacity only, which
       the compositor handles without re-laying out the card -- a phone can run
       a screenful of these without breaking a sweat, and the Pi never sees any
       of it: it ships the markup once and the browser does the rest. */
    .dev-icon {
      width: 24px; height: 24px; flex: none;
      color: var(--faint);
      transition: color .35s ease;
    }
    .dev-icon svg, .ic svg { width: 100%; height: 100%; display: block; }
    .ic { display: inline-block; flex: none; }
    .dev-icon.is-active { color: var(--accent-text); }

    /* The filled twin of the outline, faded in behind it. */
    .dev-icon .glow { opacity: 0; transition: opacity .4s ease; }
    .dev-icon.is-active .glow {
      opacity: var(--glow, .2);
      animation: icon-breathe 4.8s ease-in-out infinite;
    }
    @keyframes icon-breathe {
      0%, 100% { opacity: var(--glow, .2); }
      50%      { opacity: calc(var(--glow, .2) * 2); }
    }

    /* Rays spring out when a lamp lights up. */
    .dev-icon .rays {
      opacity: 0;
      transform: scale(.55);
      transform-box: fill-box; transform-origin: center;
      transition: opacity .3s ease, transform .35s cubic-bezier(.2, .9, .3, 1.5);
    }
    .dev-icon.is-active .rays { opacity: 1; transform: scale(1); }

    /* A rocker switch actually rocks. */
    .dev-icon .lever {
      transform-box: fill-box; transform-origin: center;
      transition: transform .3s cubic-bezier(.2, .9, .3, 1.5);
    }
    .dev-icon.is-active .lever { transform: translateY(-5.4px); }

    /* A door or window swings open; hinged on the side it is drawn from. */
    .dev-icon .panel {
      transform-box: fill-box; transform-origin: left center;
      transition: transform .4s cubic-bezier(.3, .8, .3, 1);
    }
    .dev-icon.is-active .panel { transform: scaleX(.3); }

    /* Occupancy: one slow ring outward, not a strobe. */
    .dev-icon .ping {
      opacity: 0;
      transform-box: fill-box; transform-origin: center;
    }
    .dev-icon.is-active .ping { animation: icon-ping 2.6s ease-out infinite; }
    @keyframes icon-ping {
      0%        { opacity: .55; transform: scale(.55); }
      70%, 100% { opacity: 0;   transform: scale(1.1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
