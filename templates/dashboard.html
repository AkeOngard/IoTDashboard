{% extends "base.html" %}
{% block title %}IoT Control Gateway{% endblock %}
{% block head_scripts %}<script src="{{ static_url('dashboard.js') }}"></script>{% endblock %}

{% block content %}
<!-- No x-init: Alpine calls the component's init() by itself, and calling it
     again here opened a second WebSocket -- every message sent twice. -->
<div x-data="dashboard()" x-cloak class="min-h-screen">

  <!-- ── header ─────────────────────────────────────────────────────────── -->
  <header class="sticky top-0 z-20 border-b border-[var(--line)] bg-[var(--bg)]/85 backdrop-blur-xl">
    <!-- Narrow screens drop the status onto its own row (order-3 + w-full)
         rather than truncating it; from sm up everything sits on one line. -->
    <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-4 gap-y-1 px-6 py-3 sm:h-16 sm:flex-nowrap sm:py-0">
      <h1 class="order-1 whitespace-nowrap text-[15px] font-semibold tracking-tight">IoT Gateway</h1>

      <!-- One line instead of three dots: say the single most useful thing. -->
      <div class="order-3 flex w-full min-w-0 items-center gap-2 sm:order-2 sm:w-auto">
        <span class="h-[6px] w-[6px] shrink-0 rounded-full"
              :class="health.tone === 'on' ? 'bg-[var(--on)]'
                    : health.tone === 'warn' ? 'bg-[var(--warn)] is-pending'
                    : health.tone === 'danger' ? 'bg-[var(--danger)] is-pending'
                    : 'bg-[var(--faint)]'"></span>
        <span class="truncate text-[13px] text-[var(--muted)]" x-text="health.text"></span>
      </div>

      <div class="order-2 ml-auto flex shrink-0 items-center gap-4 sm:order-3">
        <span class="hidden whitespace-nowrap text-[13px] text-[var(--faint)] sm:block">
          <span class="text-[var(--muted)]" x-text="devices.length"></span> อุปกรณ์
        </span>
        <button @click="refresh()"
                class="whitespace-nowrap rounded-full px-3 py-1.5 text-[13px] text-[var(--muted)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--text)]">
          สแกนใหม่
        </button>
        <button @click="account.open = !account.open" title="เปลี่ยนรหัสผ่าน"
                class="shrink-0 rounded-full p-1.5 text-[var(--muted)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--text)]">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="5.5" r="2.6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M2.8 14a5.2 5.2 0 0 1 10.4 0" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round"/>
          </svg>
        </button>
        <!-- Logout is the one account action you reach for on a borrowed
             screen, so it gets its own button with a word on it rather than a
             place inside the panel. The word hides on a phone; the icon stays. -->
        <button @click="logout()" :disabled="loggingOut" title="ออกจากระบบ"
                class="-mr-2 flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-1.5 text-[13px] text-[var(--muted)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--danger)] disabled:opacity-50">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 2.8H3.6a1 1 0 0 0-1 1v8.4a1 1 0 0 0 1 1H6M10.4 11l3-3-3-3M13.2 8H6.4"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
          <span class="hidden sm:inline">ออกจากระบบ</span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-6 pb-24 pt-10">

    <!-- Suggests the rooms already in use while renaming. -->
    <datalist id="room-names">
      <template x-for="room in rooms" :key="room"><option :value="room"></option></template>
    </datalist>

    <!-- Empty state names the actual blocker: no server, no matter-server, or
         a reachable matter-server with nothing commissioned yet. -->
    <template x-if="devices.length === 0">
      <div class="py-32 text-center text-[13px] leading-relaxed">
        <p class="text-[var(--muted)]"
           x-text="!socket ? 'ต่อเซิร์ฟเวอร์ไม่ได้'
                 : !adapterConnected ? 'ยังต่อ ' + adapterName + ' ไม่ได้'
                 : 'ยังไม่มีอุปกรณ์'"></p>
        <p class="mt-1 text-[var(--faint)]"
           x-text="!socket ? 'กำลังลองเชื่อมต่อใหม่อัตโนมัติ'
                 : !adapterConnected ? 'ตรวจว่า matter-server รันอยู่ และ MATTER_WS_URL ชี้ถูกที่'
                 : 'matter-server พร้อมแล้ว — commission Hub เข้า fabric ก่อน'"></p>
      </div>
    </template>

    <template x-for="room in rooms" :key="room">
      <section class="mb-12">

        <div class="mb-4 flex items-baseline gap-3">
          <h2 class="text-[13px] font-medium tracking-tight text-[var(--muted)]" x-text="room"></h2>
          <span class="text-[12px] tabular-nums text-[var(--faint)]" x-text="byRoom(room).length"></span>
          <span class="ml-1 h-px flex-1 bg-[var(--line)]"></span>
        </div>

        <div class="grid items-start gap-3 sm:grid-cols-2 lg:grid-cols-3">
          <template x-for="device in byRoom(room)" :key="device.id">

            <article class="tinted group rounded-2xl bg-[var(--surface)] p-5 ring-1 ring-white/[.05] transition-colors hover:bg-[var(--surface-hover)]"
                     :class="device.online ? '' : 'opacity-45'"
                     :style="cardTint(device)">

              <!-- name. The hub rarely knows what the operator calls a device,
                   so the card is where a real name gets attached. -->
              <template x-if="editing !== device.id">
                <div class="mb-4 flex items-start gap-2">
                  <!-- Device icon. The glyph says what the thing is, its colour
                       and glow say what it is doing right now. All of it is
                       inline SVG driven by CSS, so the Pi serves it as part of
                       the page and the viewer's browser does the drawing. -->
                  <span class="dev-icon" :class="iconActive(device) && 'is-active'"
                        :style="iconStyle(device)" aria-hidden="true">
                    <template x-if="iconKind(device) === 'light'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <g class="rays" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                          <path d="M12 1.5v2M3.9 4.4l1.4 1.4M1.5 12.5h2M20.1 4.4l-1.4 1.4M22.5 12.5h-2"/>
                        </g>
                        <path class="glow" fill="currentColor"
                              d="M12 4.5a6.2 6.2 0 0 0-3.7 11.2v2.1h7.4v-2.1A6.2 6.2 0 0 0 12 4.5Z"/>
                        <path d="M12 4.5a6.2 6.2 0 0 0-3.7 11.2v2.1h7.4v-2.1A6.2 6.2 0 0 0 12 4.5Z"
                              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M9.8 20.5h4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      </svg>
                    </template>

                    <template x-if="iconKind(device) === 'plug'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <path class="glow" fill="currentColor"
                              d="M6.5 9.5h11v3.2a5.5 5.5 0 0 1-11 0V9.5Z"/>
                        <path d="M6.5 9.5h11v3.2a5.5 5.5 0 0 1-11 0V9.5Z"
                              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M9.3 9.5V4.2M14.7 9.5V4.2M12 18.2v2.6"
                              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      </svg>
                    </template>

                    <template x-if="iconKind(device) === 'switch'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <rect class="glow" x="6" y="3" width="12" height="18" rx="3" fill="currentColor"/>
                        <rect x="6" y="3" width="12" height="18" rx="3"
                              stroke="currentColor" stroke-width="1.5"/>
                        <!-- The rocker itself moves: the one part of the icon
                             that mirrors the physical thing being switched. -->
                        <rect class="lever" x="9" y="12.6" width="6" height="5.4" rx="1.6"
                              fill="currentColor"/>
                      </svg>
                    </template>

                    <template x-if="iconKind(device) === 'contact'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <path d="M4 3.5h16v17H4z" stroke="currentColor" stroke-width="1.5"
                              stroke-linejoin="round"/>
                        <path class="panel" d="M12 3.5h8v17h-8z" fill="currentColor"
                              fill-opacity=".18" stroke="currentColor" stroke-width="1.5"
                              stroke-linejoin="round"/>
                        <circle cx="13.6" cy="12" r=".9" fill="currentColor"/>
                      </svg>
                    </template>

                    <template x-if="iconKind(device) === 'occupancy'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <circle class="ping" cx="12" cy="12" r="9.5" stroke="currentColor"
                                stroke-width="1.5"/>
                        <circle cx="12" cy="8.4" r="2.9" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M5.8 20.2a6.2 6.2 0 0 1 12.4 0" stroke="currentColor"
                              stroke-width="1.5" stroke-linecap="round"/>
                      </svg>
                    </template>

                    <template x-if="iconKind(device) === 'climate'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <path d="M9.5 13.8V5a2.2 2.2 0 1 1 4.4 0v8.8a4.6 4.6 0 1 1-4.4 0Z"
                              stroke="currentColor" stroke-width="1.5"/>
                        <path class="mercury" d="M11.7 9.5v6.8" stroke="currentColor"
                              stroke-width="2.6" stroke-linecap="round"/>
                      </svg>
                    </template>

                    <template x-if="iconKind(device) === 'lux'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <circle class="glow" cx="12" cy="12" r="4.6" fill="currentColor"/>
                        <circle cx="12" cy="12" r="4.6" stroke="currentColor" stroke-width="1.5"/>
                        <g class="rays" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                          <path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7"/>
                        </g>
                      </svg>
                    </template>

                    <template x-if="iconKind(device) === 'sensor'">
                      <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
                        <path d="M6.6 6.6a7.6 7.6 0 0 0 0 10.8M17.4 6.6a7.6 7.6 0 0 1 0 10.8"
                              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      </svg>
                    </template>
                  </span>

                  <h3 class="min-w-0 flex-1 truncate text-[14px] font-medium tracking-tight"
                      :title="device.adapter + ' · ' + device.native_id
                              + (device.hub_name ? ' · hub: ' + device.hub_name : '')"
                      x-text="device.name"></h3>

                  <template x-if="!device.online">
                    <span class="mt-[6px] h-[6px] w-[6px] shrink-0 rounded-full bg-[var(--faint)]"
                          title="อุปกรณ์ออฟไลน์"></span>
                  </template>

                  <!-- Shown on hover, and on focus for keyboard users: renaming
                       is occasional, so the card stays quiet the rest of the time. -->
                  <button @click="startEdit(device)" title="ตั้งชื่อ / กำหนดห้อง"
                          class="-mt-1 shrink-0 rounded-lg p-1.5 text-[var(--faint)] opacity-0 transition hover:bg-[var(--surface-hover)] hover:text-[var(--text)] focus-visible:opacity-100 group-hover:opacity-100">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                      <path d="M9.5 3.2 12.8 6.5M3 13h2.6l7-7a1.6 1.6 0 0 0 0-2.3l-1-1a1.6 1.6 0 0 0-2.3 0l-7 7V13Z"
                            stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>

                  <template x-if="historyEnabled">
                    <button @click="openChart(device)" title="ดูกราฟย้อนหลัง"
                            class="-mr-1 -mt-1 shrink-0 rounded-lg p-1.5 text-[var(--faint)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--text)]">
                      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M1.5 11.5 5 7.5l2.8 2.4L14.5 3.5" stroke="currentColor"
                              stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </template>
                </div>
              </template>

              <template x-if="editing === device.id">
                <div class="mb-4 space-y-2" @keydown.escape.stop="cancelEdit()">
                  <input x-model="draft.name" maxlength="60" placeholder="ชื่ออุปกรณ์"
                         x-init="$nextTick(() => $el.focus())"
                         @keydown.enter.stop="saveEdit(device)"
                         class="w-full rounded-lg bg-[var(--bg)] px-2.5 py-1.5 text-[14px] font-medium outline-none ring-1 ring-[var(--line)] focus:ring-white/25">
                  <input x-model="draft.room" maxlength="60" placeholder="ห้อง" list="room-names"
                         @keydown.enter.stop="saveEdit(device)"
                         class="w-full rounded-lg bg-[var(--bg)] px-2.5 py-1.5 text-[13px] text-[var(--muted)] outline-none ring-1 ring-[var(--line)] focus:ring-white/25">
                  <div class="flex items-center gap-2 pt-0.5">
                    <button @click="saveEdit(device)" :disabled="saving"
                            class="rounded-lg bg-[var(--on)] px-2.5 py-1 text-[12px] font-medium text-black transition-opacity hover:opacity-90 disabled:opacity-50">
                      บันทึก
                    </button>
                    <button @click="cancelEdit()"
                            class="rounded-lg px-2 py-1 text-[12px] text-[var(--muted)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--text)]">
                      ยกเลิก
                    </button>
                    <template x-if="device.hub_name">
                      <button @click="resetLabel(device)"
                              :title="'กลับไปใช้ ' + device.hub_name"
                              class="ml-auto rounded-lg px-2 py-1 text-[12px] text-[var(--faint)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--text)]">
                        ใช้ชื่อจาก hub
                      </button>
                    </template>
                  </div>
                </div>
              </template>

              <!-- hero readings -->
              <template x-if="heroCaps(device).length">
                <div class="mb-1 flex flex-wrap gap-x-9 gap-y-4">
                  <template x-for="cap in heroCaps(device)" :key="cap">
                    <div>
                      <p class="text-[10px] uppercase tracking-[0.14em] text-[var(--faint)]"
                         x-text="LABEL[cap] || cap"></p>
                      <p class="mt-1.5 text-[30px] font-medium leading-none tracking-tight tabular-nums"
                         :style="'color: ' + readingColor(device.id, cap)">
                        <span x-text="format(device.id, cap)"></span><span
                          class="ml-1 text-[14px] font-normal text-[var(--faint)]"
                          x-text="unit(device.id, cap)"></span>
                      </p>
                    </div>
                  </template>
                </div>
              </template>

              <!-- switch -->
              <template x-if="device.writable.includes('switch')">
                <div class="mt-5 flex items-center justify-between gap-4">
                  <span class="text-[13px] text-[var(--muted)]"
                        x-text="statusLabel(device.id, 'switch')"></span>
                  <button @click="toggle(device)" :disabled="!device.online"
                          :aria-pressed="shown(device.id,'switch') ? 'true' : 'false'"
                          class="relative h-6 w-11 shrink-0 rounded-full outline-none transition-colors focus-visible:ring-2 focus-visible:ring-white/25 focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--bg)] disabled:cursor-not-allowed"
                          :class="[
                            shown(device.id,'switch') ? 'bg-[var(--on)]' : 'bg-[var(--track)]',
                            isPending(device.id,'switch') ? 'is-pending' : ''
                          ]"
                          :style="toggleStyle(device)">
                    <span class="absolute top-[3px] h-[18px] w-[18px] rounded-full bg-white shadow-sm transition-all duration-200"
                          :class="shown(device.id,'switch') ? 'left-[23px]' : 'left-[3px]'"></span>
                  </button>
                </div>
              </template>

              <!-- sliders -->
              <template x-for="cap in device.writable.filter(c => c !== 'switch')" :key="cap">
                <div class="mt-4" :class="isPending(device.id, cap) ? 'is-pending' : ''">
                  <div class="mb-1 flex items-baseline justify-between gap-3">
                    <span class="text-[12px] text-[var(--faint)]" x-text="LABEL[cap] || cap"></span>
                    <span class="text-[12px] tabular-nums text-[var(--muted)]">
                      <span x-text="shown(device.id, cap) ?? '—'"></span><span x-text="UNIT[cap] || ''"></span>
                    </span>
                  </div>
                  <input type="range" class="slider w-full"
                         :min="RANGE[cap][0]" :max="RANGE[cap][1]" :step="RANGE[cap][2]"
                         :disabled="!device.online"
                         :value="shown(device.id, cap) ?? RANGE[cap][0]"
                         :style="sliderStyle(device, cap)"
                         :aria-label="LABEL[cap] || cap"
                         @input="slide(device, cap, $event.target.value)">
                </div>
              </template>

              <!-- secondary readings and staleness: shown only when they say
                   something. A fresh sensor needs no timestamp. -->
              <template x-if="footnote(device).length">
                <div class="mt-5 flex flex-wrap items-center gap-x-4 gap-y-1">
                  <template x-for="note in footnote(device)" :key="note.key">
                    <span class="text-[11px]" :style="'color: ' + note.color"
                          x-text="note.text"></span>
                  </template>
                </div>
              </template>

            </article>
          </template>
        </div>
      </section>
    </template>
  </main>

  <!-- ── history ────────────────────────────────────────────────────────── -->
  <div x-show="chart.open" @keydown.escape.window="closeChart()"
       class="fixed inset-0 z-40 flex items-end justify-center bg-black/60 p-0 backdrop-blur-sm sm:items-center sm:p-6">
    <div @click.outside="closeChart()"
         class="w-full max-w-3xl overflow-hidden rounded-t-3xl bg-[#141416] shadow-2xl sm:rounded-2xl">

      <div class="flex items-start justify-between gap-4 px-6 pt-6">
        <div class="min-w-0">
          <h3 class="truncate text-[15px] font-medium tracking-tight" x-text="chart.device?.name"></h3>
          <p class="mt-0.5 text-[12px] text-[var(--faint)]" x-text="chart.device?.room"></p>
        </div>
        <button @click="closeChart()" aria-label="ปิด"
                class="-mr-2 -mt-1 rounded-lg p-2 text-[var(--faint)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--text)]">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="mt-5 flex flex-wrap items-center gap-x-1 gap-y-2 px-6">
        <template x-for="cap in (chart.device?.capabilities || [])" :key="cap">
          <button @click="pickCapability(cap)"
                  class="rounded-full px-3 py-1 text-[12px] transition-colors"
                  :class="chart.capability === cap
                    ? 'bg-[var(--surface-hover)] text-[var(--text)]'
                    : 'text-[var(--faint)] hover:text-[var(--muted)]'"
                  x-text="LABEL[cap] || cap"></button>
        </template>
        <div class="ml-auto flex gap-1">
          <template x-for="r in RANGES" :key="r.hours">
            <button @click="pickRange(r.hours)"
                    class="rounded-full px-2.5 py-1 text-[12px] tabular-nums transition-colors"
                    :class="chart.hours === r.hours
                      ? 'bg-[var(--surface-hover)] text-[var(--text)]'
                      : 'text-[var(--faint)] hover:text-[var(--muted)]'"
                    x-text="r.label"></button>
          </template>
        </div>
      </div>

      <div class="px-6 pb-6 pt-5">
        <div class="relative h-64">
          <canvas x-ref="canvas"></canvas>
          <template x-if="chart.loading">
            <div class="absolute inset-0 flex items-center justify-center text-[13px] text-[var(--faint)]">
              กำลังโหลด…
            </div>
          </template>
          <template x-if="!chart.loading && !chart.error && chart.data && chart.data.points.length === 0">
            <div class="absolute inset-0 flex items-center justify-center text-[13px] text-[var(--faint)]">
              ยังไม่มีข้อมูลในช่วงเวลานี้
            </div>
          </template>
          <template x-if="chart.error">
            <div class="absolute inset-0 flex items-center justify-center px-8 text-center text-[13px]"
                 style="color: var(--danger)" x-text="chart.error"></div>
          </template>
        </div>

        <div class="mt-6 flex flex-wrap items-end gap-x-10 gap-y-3 border-t border-[var(--line)] pt-5">
          <template x-for="s in summary" :key="s.label">
            <div>
              <p class="text-[10px] uppercase tracking-[0.14em] text-[var(--faint)]" x-text="s.label"></p>
              <p class="mt-1 text-[17px] font-medium tabular-nums"
                 :style="'color: ' + s.color" x-text="s.value"></p>
            </div>
          </template>
          <p class="ml-auto text-[11px] text-[var(--faint)]" x-text="chartSource"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ── toasts ─────────────────────────────────────────────────────────── -->
  <div class="pointer-events-none fixed inset-x-4 bottom-4 z-50 flex flex-col items-center gap-2 sm:inset-x-auto sm:right-6 sm:bottom-6 sm:items-end">
    <template x-for="t in toasts" :key="t.id">
      <div class="w-full max-w-sm rounded-xl bg-[#1a1a1d] px-4 py-3 shadow-xl ring-1 ring-white/[.06]">
        <p class="text-[13px] font-medium"
           :style="t.kind === 'error' ? 'color: var(--danger)' : 'color: var(--on)'"
           x-text="t.title"></p>
        <p class="mt-0.5 text-[12px] leading-snug text-[var(--muted)]" x-text="t.body"></p>
      </div>
    </template>
  </div>
  <!-- ── account ────────────────────────────────────────────────────────── -->
  <!-- Opaque, like the chart dialog: the see-through --surface let the device
       cards show through behind the text and made it hard to read. Body text
       is --muted rather than --faint for the same reason; --faint is for
       labels you glance past, not sentences you have to read. -->
  <template x-if="account.open">
    <div class="fixed inset-0 z-30 flex items-start justify-center bg-black/60 px-6 pt-24 backdrop-blur-sm"
         @click.self="account.open = false" @keydown.escape.window="account.open = false">
      <div class="w-full max-w-[360px] rounded-2xl bg-[#141416] p-6 shadow-2xl ring-1 ring-white/[.08]">
        <h2 class="text-[16px] font-semibold tracking-tight">เปลี่ยนรหัสผ่าน</h2>
        <p class="mt-1.5 text-[13px] leading-relaxed text-[var(--muted)]">
          เปลี่ยนแล้วเบราว์เซอร์อื่นทุกเครื่องจะถูกให้ออกจากระบบ ยกเว้นเครื่องนี้
        </p>

        <div class="mt-5 space-y-3">
          <label class="block">
            <span class="mb-1.5 block text-[13px] text-[var(--text)]">รหัสผ่านปัจจุบัน</span>
            <input x-model="account.current" type="password" autocomplete="current-password"
                   :disabled="account.busy"
                   class="w-full rounded-lg bg-[var(--bg)] px-3 py-2.5 text-[16px] text-[var(--text)] outline-none ring-1 ring-white/[.12] focus:ring-white/40 disabled:opacity-50">
          </label>
          <label class="block">
            <span class="mb-1.5 block text-[13px] text-[var(--text)]">รหัสผ่านใหม่</span>
            <input x-model="account.next" type="password" autocomplete="new-password"
                   :disabled="account.busy"
                   @keydown.enter="changePassword()"
                   class="w-full rounded-lg bg-[var(--bg)] px-3 py-2.5 text-[16px] text-[var(--text)] outline-none ring-1 ring-white/[.12] focus:ring-white/40 disabled:opacity-50">
            <span class="mt-1.5 block text-[12px] text-[var(--muted)]">อย่างน้อย 10 ตัวอักษร</span>
          </label>
        </div>

        <template x-if="account.error">
          <p class="mt-3 text-[13px] text-[var(--danger)]" x-text="account.error"></p>
        </template>
        <template x-if="account.done">
          <p class="mt-3 text-[13px] text-[var(--on)]">เปลี่ยนรหัสผ่านแล้ว</p>
        </template>

        <div class="mt-5 flex items-center gap-2">
          <button @click="changePassword()" :disabled="account.busy || !account.current || !account.next"
                  class="rounded-lg bg-[var(--on)] px-4 py-2 text-[14px] font-medium text-black transition-opacity hover:opacity-90 disabled:opacity-40">
            <span x-text="account.busy ? 'กำลังบันทึก…' : 'บันทึก'"></span>
          </button>
          <button @click="account.open = false"
                  class="rounded-lg px-3 py-2 text-[14px] text-[var(--muted)] transition-colors hover:bg-[var(--surface-hover)] hover:text-[var(--text)]">
            ปิด
          </button>
        </div>

        <!-- Separate from changing the password: for a phone left signed in
             somewhere, there is no reason to invent a new password. -->
        <div class="mt-6 border-t border-white/[.08] pt-5">
          <p class="text-[13px] leading-relaxed text-[var(--muted)]">
            ลืมออกจากระบบบนเครื่องอื่น? ให้ทุกเครื่องหลุดพร้อมกัน รวมเครื่องนี้ด้วย
            โดยไม่ต้องเปลี่ยนรหัสผ่าน
          </p>
          <button @click="logoutAll()" :disabled="loggingOut"
                  class="mt-3 rounded-lg px-3 py-2 text-[14px] text-[var(--danger)] ring-1 ring-white/[.12] transition-colors hover:bg-[var(--surface-hover)] disabled:opacity-50">
            ออกจากระบบทุกเครื่อง
          </button>
        </div>
      </div>
    </div>
  </template>

</div>
{% endblock %}
