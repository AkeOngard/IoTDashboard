# Production overlay (doc §12): resource limits, read-only root filesystem,
# no source mounts, JSON log rotation.
services:
  app:
    command: ["serve"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    # Doc §11: bind to loopback only; nothing outside the host talks to Postgres.
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  matter-server:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
