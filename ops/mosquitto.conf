# Internal bus only (doc §11: never expose :1883 to the internet).
listener 1883 127.0.0.1
protocol mqtt

# No anonymous access even on loopback -- create the file with:
#   mosquitto_passwd -c ops/mosquitto.passwd iot
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type warning
log_type error
connection_messages true
